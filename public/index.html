<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Star — 행정·상담 지원</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>Job Star</h1>
          <p>행정업무 자동화 · 상담 지원</p>
        </div>
      </div>
      <div class="header-right">
        <div class="api-status" id="api-status" title="API 키 감지 상태">
          <span class="api-status-dot" id="api-status-dot"></span>
          <span id="api-status-text">API 키 감지 중…</span>
        </div>
        <p class="header-note">상담사·행정 실무자를 위한 문서 생성 도구</p>
      </div>
    </header>

    <main class="layout">
      <nav class="feature-nav" aria-label="업무 유형">
        <button type="button" class="nav-item is-active" data-feature="counselingLog">
          <span class="nav-num">01</span>
          <span class="nav-label">상담일지 자동 생성</span>
        </button>
        <button type="button" class="nav-item" data-feature="interviewQA">
          <span class="nav-num">02</span>
          <span class="nav-label">면접 예상 질문·답변</span>
        </button>
        <button type="button" class="nav-item" data-feature="interviewFeedback">
          <span class="nav-num">03</span>
          <span class="nav-label">모의 면접 피드백</span>
        </button>
        <button type="button" class="nav-item" data-feature="followUpPlan">
          <span class="nav-num">04</span>
          <span class="nav-label">사후관리 계획</span>
        </button>
        <button type="button" class="nav-item" data-feature="caseClosure">
          <span class="nav-num">05</span>
          <span class="nav-label">사례 종결 보고서</span>
        </button>
        <button type="button" class="nav-item" data-feature="strategyPivot">
          <span class="nav-num">06</span>
          <span class="nav-label">취업 전략 전환</span>
        </button>
      </nav>

      <section class="workspace">
        <div class="panel panel-form">
          <div class="panel-head">
            <h2 id="feature-title">상담일지 자동 생성</h2>
            <p id="feature-desc">참여자 정보와 상담 내용을 입력하면 정식 상담일지 양식으로 생성합니다.</p>
          </div>

          <!-- ① 상담일지 -->
          <form class="feature-form is-active" id="form-counselingLog" data-feature="counselingLog">
            <label>
              <span>참여자 정보 <em>(나이, 성별, 경력 등)</em></span>
              <textarea name="participantInfo" rows="2" placeholder="예: 52세 여성, 경리·총무 경력 12년, 육아로 5년 공백" required></textarea>
            </label>
            <label>
              <span>상담 일시 및 방법</span>
              <input type="text" name="sessionInfo" placeholder="예: 2026.07.27 14:00 / 대면 상담" required />
            </label>
            <label>
              <span>주요 논의 내용</span>
              <textarea name="discussion" rows="4" placeholder="오늘 상담에서 다룬 핵심 내용을 적어 주세요." required></textarea>
            </label>
            <label>
              <span>합의 사항</span>
              <textarea name="agreements" rows="3" placeholder="내담자와 합의한 실행 계획을 적어 주세요." required></textarea>
            </label>
            <label>
              <span>다음 상담 일정</span>
              <input type="text" name="nextSession" placeholder="예: 2026.08.03 14:00 / 이력서 피드백" required />
            </label>
            <button type="submit" class="btn-generate">상담일지 생성</button>
          </form>

          <!-- ② 면접 예상 질문 -->
          <form class="feature-form" id="form-interviewQA" data-feature="interviewQA" hidden>
            <label>
              <span>참여자 정보 <em>(나이, 성별, 경력 공백)</em></span>
              <textarea name="participantInfo" rows="3" placeholder="예: 48세 여성, 영업관리 8년, 경력 공백 7년" required></textarea>
            </label>
            <label>
              <span>지원 회사</span>
              <input type="text" name="company" placeholder="예: ○○물류(중견기업)" required />
            </label>
            <label>
              <span>지원 직무</span>
              <input type="text" name="job" placeholder="예: 고객지원·CS 관리" required />
            </label>
            <button type="submit" class="btn-generate">면접 대비 자료 생성</button>
          </form>

          <!-- ③ 모의 면접 피드백 -->
          <form class="feature-form" id="form-interviewFeedback" data-feature="interviewFeedback" hidden>
            <label>
              <span>면접 질문</span>
              <textarea name="question" rows="2" placeholder="예: 경력 공백 기간 동안 무엇을 하셨나요?" required></textarea>
            </label>
            <label>
              <span>내담자의 실제 답변</span>
              <textarea name="answer" rows="6" placeholder="내담자가 실제로 답변한 내용을 그대로 입력해 주세요." required></textarea>
            </label>
            <button type="submit" class="btn-generate">피드백 생성</button>
          </form>

          <!-- ④ 사후관리 계획 -->
          <form class="feature-form" id="form-followUpPlan" data-feature="followUpPlan" hidden>
            <label>
              <span>내담자 정보 <em>(나이, 직무, 취업 기업 규모)</em></span>
              <textarea name="participantInfo" rows="4" placeholder="예: 55세, 사무보조, 중소 제조업체(직원 80명), 주 5일 출근" required></textarea>
            </label>
            <button type="submit" class="btn-generate">사후관리 계획 생성</button>
          </form>

          <!-- ⑤ 사례 종결 보고서 -->
          <form class="feature-form" id="form-caseClosure" data-feature="caseClosure" hidden>
            <label>
              <span>참여 기간</span>
              <input type="text" name="period" placeholder="예: 2026.01.15 ~ 2026.06.30" required />
            </label>
            <label>
              <span>상담 회기</span>
              <input type="text" name="sessions" placeholder="예: 총 12회 (대면 8 / 전화 4)" required />
            </label>
            <label>
              <span>취업 결과 <em>(직무, 급여, 지역)</em></span>
              <textarea name="employmentResult" rows="2" placeholder="예: 총무 보조, 월 230만 원, 인천 남동구" required></textarea>
            </label>
            <label>
              <span>주요 개입 내용</span>
              <textarea name="interventions" rows="4" placeholder="이력서 컨설팅, 모의면접, 직무 전환 상담 등" required></textarea>
            </label>
            <label>
              <span>기타 참고 사항 <em>(선택)</em></span>
              <textarea name="notes" rows="2" placeholder="추가로 반영할 내용이 있으면 적어 주세요."></textarea>
            </label>
            <button type="submit" class="btn-generate">종결 보고서 생성</button>
          </form>

          <!-- ⑥ 취업 전략 전환 -->
          <form class="feature-form" id="form-strategyPivot" data-feature="strategyPivot" hidden>
            <label>
              <span>참여 기간</span>
              <input type="text" name="period" placeholder="예: 2026.03 ~ 현재 (약 4개월)" required />
            </label>
            <label>
              <span>구직활동 이력</span>
              <textarea name="jobSearchHistory" rows="4" placeholder="지원 건수, 서류 통과율, 면접 경험 등을 적어 주세요." required></textarea>
            </label>
            <label>
              <span>주요 탈락 단계</span>
              <select name="failStage" required>
                <option value="">선택해 주세요</option>
                <option value="서류">서류</option>
                <option value="면접">면접</option>
                <option value="최종">최종</option>
                <option value="서류·면접 혼재">서류·면접 혼재</option>
              </select>
            </label>
            <label>
              <span>기타 참고 사항 <em>(선택)</em></span>
              <textarea name="notes" rows="2" placeholder="희망 직무, 제약 조건 등"></textarea>
            </label>
            <button type="submit" class="btn-generate">전략 전환안 생성</button>
          </form>
        </div>

        <div class="panel panel-result">
          <div class="panel-head result-head">
            <h2>생성 결과</h2>
            <div class="result-actions">
              <button type="button" id="btn-copy" class="btn-ghost" disabled>복사</button>
              <button type="button" id="btn-clear" class="btn-ghost" disabled>비우기</button>
            </div>
          </div>
          <div id="result-status" class="result-status" role="status" aria-live="polite"></div>
          <article id="result-output" class="result-output" aria-label="생성 결과">
            <p class="result-placeholder">왼쪽에서 업무를 선택하고 내용을 입력한 뒤 생성 버튼을 눌러 주세요.</p>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Gemini API 키는 서버 환경변수에서만 사용되며 브라우저로 전송되지 않습니다.
      </p>
    </footer>

    <script src="prompts.js"></script>
    <script src="script.js"></script>
  </body>
</html>
